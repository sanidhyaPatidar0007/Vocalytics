[project]
name = "voice-data-analyst-saas"
version = "1.0.0"
description = "Multi-tenant, local-first data quality and analytics app with local LLM and voice input"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "ui: Streamlit AppTest user-interface tests",
    "e2e: end-to-end workflow tests across several services",
]
filterwarnings = [
    "ignore::DeprecationWarning:speech_recognition.*",
    "ignore::DeprecationWarning:altair.*",
]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".venv", "storage", "logs", "dist", "data", "models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "S101",  # assert is fine in tests and invariants
    "S608",  # no string-built SQL exists; ORM only (rule is noisy on f-strings)
    "B008",
    "UP007",
    "UP045",
]

[tool.ruff.lint.pycodestyle]
# The formatter wraps code at 110 columns; long user-facing messages may run to 120.
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "S603", "S607", "B017"]
"scripts/**" = ["S603", "S607"]
